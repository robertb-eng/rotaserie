<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<meta name="theme-color" content="#a9d8ff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0a1230" media="(prefers-color-scheme: dark)">
<meta property="og:title" content="{{og_title}}">
{{#if og_description}}<meta property="og:description" content="{{og_description}}">
{{/if}}<meta property="og:image" content="https://rotaserie.com/img/new/d_builder_light.webp">
<link rel="icon" href="img/logo.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="preload" href="fonts/atkinson-next.woff2" as="font" type="font/woff2" crossorigin>
<script>document.documentElement.classList.add("js");try{var t=localStorage.getItem("sb-theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="stylesheet" href="styles.css">
<script src="site.js" defer></script>
</head>
<body{{#if body_class}} class="{{body_class}}"{{/if}}>
<a class="skip" href="#main">Skip to content</a>

{{> nav}}
<main id="main">
{{main}}</main>

<footer class="foot">
  <div class="wrap foot-in">
    <a class="logo" href="index.html"><img src="img/logo.svg" alt="" width="28" height="28">Rotaserie</a>
    <p>Scheduling for small businesses, built in Washington State. <a href="about.html">About us</a> · {{#if foot_facts}}<a href="facts.html">Facts</a> · {{/if}}<a href="terms.html">Terms</a> · <a href="privacy.html">Privacy</a></p>
    <p class="muted">© <span data-year>2026</span> TICO VENTURES LLC · Shoreline, Washington</p>
  </div>
</footer>

<dialog class="zoom" data-zoombox aria-label="Screenshot">
  <button class="zoom-close" type="button" aria-label="Close" data-zoom-close>×</button>
  <img alt="">
</dialog>
</body>
</html>
