<!doctype html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<meta name="theme-color" content="#f4f2ee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131211" media="(prefers-color-scheme: dark)">
<link rel="canonical" href="{{url}}">
{{#if multi_lang}}<link rel="alternate" hreflang="en" href="{{url_en}}">
<link rel="alternate" hreflang="es" href="{{url_es}}">
<link rel="alternate" hreflang="x-default" href="{{url_en}}">
{{/if}}<meta property="og:type" content="website">
<meta property="og:site_name" content="Rotaserie">
<meta property="og:url" content="{{url}}">
<meta property="og:title" content="{{og_title}}">
{{#if og_description}}<meta property="og:description" content="{{og_description}}">
{{/if}}<meta property="og:image" content="https://rotaserie.com/img/share-{{lang}}.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="{{base}}img/logo.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="{{base}}img/apple-touch-icon.png">
<link rel="preload" href="{{base}}fonts/atkinson-next.woff2" as="font" type="font/woff2" crossorigin>
<script>document.documentElement.classList.add("js");try{var t=localStorage.getItem("sb-theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="stylesheet" href="{{base}}tokens.css">
<link rel="stylesheet" href="{{base}}styles.css">
<script src="{{base}}site.js" defer></script>
{{#if is_home}}{{> head-home}}{{/if}}</head>
<body{{#if body_class}} class="{{body_class}}"{{/if}}>
<a class="skip" href="#main">{{skip}}</a>

{{> nav}}
<main id="main">
{{main}}</main>

{{> foot}}
</body>
</html>
