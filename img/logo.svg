<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
<!-- Rotaserie's mark (Robert, Nov 25 2026; was Nov 6): a roast chicken turning on a spit, in front of a calendar page with
     its binding (three rings, punched holes) and embers rising in its dark top; a gold crank on the spit's right end.
     apps/make_icons.py draws every icon from this file and understands only rect, circle, ellipse, path (M L H V C Q A Z)
     and <g> with translate/scale/rotate: keep to those. The ids say what each part is (the tile is the background;
     the header's holes and embers are only in the colour icons). -->
<rect id="tile" width="512" height="512" rx="112" fill="#b3261e"/>
<rect id="page" x="80" y="104" width="352" height="320" rx="60" fill="#fff3df"/>
<g id="header"><path d="M80 164a60 60 0 0 1 60-60h232a60 60 0 0 1 60 60V262H80Z" fill="#5a1410"/>
  <circle cx="112" cy="122" r="5" fill="#b3261e"/><circle cx="206" cy="122" r="5" fill="#b3261e"/><circle cx="306" cy="122" r="5" fill="#b3261e"/><circle cx="400" cy="122" r="5" fill="#b3261e"/>
  <circle cx="150" cy="232" r="9" fill="#f2a33a"/><circle cx="178" cy="188" r="6" fill="#ffd27a"/><circle cx="138" cy="160" r="5" fill="#f2a33a"/></g>
<g id="rings" fill="#fff3df"><rect x="143" y="80" width="26" height="58" rx="13"/><rect x="243" y="80" width="26" height="58" rx="13"/><rect x="343" y="80" width="26" height="58" rx="13"/></g>
<g id="chicken" transform="translate(248 340) rotate(-8) scale(0.78) translate(-256 -300)">
  <g transform="rotate(-46 330 198)"><ellipse cx="330" cy="198" rx="66" ry="42" fill="#e07b24"/>
    <g fill="#fff3df"><rect x="384" y="187" width="58" height="22" rx="11"/><circle cx="446" cy="185" r="16"/><circle cx="446" cy="211" r="16"/></g></g>
  <g transform="rotate(-70 268 192)"><ellipse cx="268" cy="192" rx="64" ry="40" fill="#e07b24"/>
    <g fill="#fff3df"><rect x="318" y="181" width="58" height="22" rx="11"/><circle cx="380" cy="179" r="16"/><circle cx="380" cy="205" r="16"/></g></g>
  <path d="M108 300C108 222 186 196 262 200C346 204 404 238 404 300C404 360 344 388 256 388C168 388 108 360 108 300Z" fill="#f2a33a"/>
  <path d="M133 273C154 227 213 210 262 212A8 8 0 0 1 262 228C220 228 168 240 147 277A8 8 0 0 1 133 273Z" fill="#ffd27a"/>
  <circle cx="300" cy="226" r="9" fill="#ffd27a"/>
  <path d="M126 330C160 372 352 372 388 330C380 366 330 388 256 388C182 388 134 366 126 330Z" fill="#c8601a"/>
</g>
<g id="spit"><rect x="40" y="330" width="420" height="16" rx="8" fill="#5a1410"/><circle cx="48" cy="338" r="21" fill="#f2a33a"/><circle cx="452" cy="338" r="19" fill="#f2a33a"/><rect x="444" y="338" width="16" height="30" rx="8" fill="#f2a33a"/><rect x="438" y="358" width="28" height="15" rx="7.5" fill="#5a1410"/></g>
</svg>
